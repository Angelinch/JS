name: CI

on:
  push:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: test
        run: |
          npm test
        continue-on-error: true

      - name: Generate HTML report
        run: |
          npx jest-html-reporters --config-file ./jest.config.ts

      - name: Notify via Telegram
        uses: appleboy/telegram-action@v0.7.0
        with:
          to: ${{ secrets.TG_CHAT_ID }}
          token: ${{ secrets.TG_BOT_TOKEN }}
          message: |
            ✅ Workflow завершён
            Репозиторий: ${{ github.repository }}
            Результат тестов: ${{ job.status }}
            [Ссылка на Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
