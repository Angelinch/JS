name: CI Tests and Reports

on:
  push:
    branches:
      - develop   # запускаем на ветке develop
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # или используем актуальную LTS версию

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload HTML report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: reports/html

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy HTML report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v6
        with:
          github_token: ${{ secrets.GH_PAT }}
          publish_dir: ./reports/html

      - name: Send Telegram notification
        uses: appleboy/telegram-action@v0.6.0
        with:
          to: ${{ secrets.TG_CHAT_ID }}
          token: ${{ secrets.TG_BOT_TOKEN }}
          message: "CI/CD workflow: Тесты завершены и отчет опубликован на GitHub Pages ✅"
