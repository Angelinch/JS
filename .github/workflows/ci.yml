name: CI

on:
  push:
    branches:
      - develop   # или main, если нужно
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test || true

      - name: Publish HTML report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports/html
          destination_dir: ''   # пустая папка в ветке gh-pages
          keep_files: true

      - name: Send Telegram notification
        uses: appleboy/telegram-action@v0.6.0
        with:
          to: ${{ secrets.TG_CHAT_ID }}
          token: ${{ secrets.TG_BOT_TOKEN }}
          message: |
            CI completed.
            HTML report: https://<USERNAME>.github.io/<REPO_NAME>/
            Check the workflow logs for details.
