name: CI/CD Test and Report

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=1024"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Commit and push test report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add reports/html
          git commit -m "Update test report [skip ci]" || echo "No changes to commit"
          git push origin develop

      - name: Send Telegram notification
        uses: appleboy/telegram-action@v0.7.0
        with:
          to: ${{ secrets.TG_CHAT_ID }}
          token: ${{ secrets.TG_BOT_TOKEN }}
          message: |
            ✅ CI/CD workflow finished
            Test report: https://<your-username>.github.io/<your-repo-name>/reports/html/report.html
